<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="/index.1303bb05.css">
        <title>Моя тестовая страница</title>
    </head>

    <body>
        <canvas id="myCanvas">
    </canvas><script src="/new-Aim400KG.3464ddca.js"></script></body>

    <script>let canvas = document.getElementById("myCanvas");
let context = canvas.getContext("2d");
let circle = new Path2D();
//куда был совершен клик
canvas.addEventListener("click", (e)=>{
    // console.log('click: ', e.clientX, e.clientY);
    if (context.isPointInPath(circle, e.offsetX, e.offsetY)) {
        context.clip();
        drawCircle();
        console.log("click: ", e.clientX, e.clientY);
    } else console.log("\u043C\u0438\u043C\u043E");
});
setMaxSize();
drawCircle();
window.addEventListener("resize", ()=>{
    setMaxSize();
    drawCircle();
});
function setMaxSize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
function drawCircle(posX, posY) {
    let radius = 40;
    posX = Math.floor(Math.random() * canvas.width);
    posY = Math.floor(Math.random() * canvas.height);
    circle.arc(posX, posY, radius, 0, 2 * Math.PI, false);
    context.fillStyle = "red";
    context.fill(circle);
}

</script>
</html>
