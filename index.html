<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="memory.css" />
    <link rel="stylesheet" href="aim.css" />
    <link rel="stylesheet" href="SWITCHING.css" />
    <link rel="stylesheet" href="wrongColor.css" />
    <link rel="stylesheet" href="2 version.css" />
    <script src="app.js" type="module"></script>
    <script src="routing.js"></script>
    <script src="functions.js"></script>
</head>

<body>
    <!-- <div class="menu"> -->
    <section id="games" class="route menu">
        <h1>Выберите игру</h1>
        <ul>
            <li><button class="menu-bt" onclick="navigateTo('games/aim')">AIM 400KG</button></li>
            <li><button class="menu-bt" onclick="navigateTo('games/memory')">Игра на запоминание</button></li>
            <li><button class="menu-bt" onclick="navigateTo('games/wrongColor')">Ложный цвет</button></li>
            <li><button class="menu-bt" onclick="navigateTo('games/switching')">Правильный вопрос</button></li>
            <li><button class="menu-bt" onclick="navigateTo('games/aim')">Простые переключения</button></li>
            <li><button class="menu-bt" onclick="navigateTo('games/aim')">Найди число</button></li>
            <li><button class="menu-bt" onclick="navigateTo('games/v2')">v2</button></li>
        </ul>
    </section>

    <!-- </div> -->
    <!-- <div id="game-container" class="hidden">
        <button onclick="backToMenu()">Вернуться в меню</button>
        <div id="game-content"></div>
    </div> -->
    <div class="wrapper">
        <!-- <header>
            <button class="bt" id="back-button">Назад</button>
        </header> -->
        <section id="memory" class="route">
            <div class="memory_wrapper">
                <div>запомните зеленые блоки</div>
                <div id="timers"></div>
                <div id="timerms"></div>
                <div class="score"></div>

                <div class="memoryDiv"></div>
                <button class="bt" id="btRotate">Запомнил</button>
            </div>
        </section>
        <section id="aim" class="route">
            <div class="aim_wrapper">
                <svg version="2" baseProfile="full" width="100%" height="100vh" xmlns="http://www.w3.org/2000/svg"
                    class="demo"></svg>
                <div class="score">
                    <div class="seconds">0 ms</div>
                    <div class="average">0 ms</div>
                </div>
            </div>
        </section>
        <section id="wrongColor" class="route">
            <div class="uWrapper">
                <div>Укажи обманный блок</div>
                <div class="blockWrapper">
                </div>

            </div>
        </section>
        <section id="switching" class="route">
            <div class="uWrapper">
                <div>Ответь на вопрос</div>
                <div class="question">Является ли буква гласной?</div>
                <div class="switchWrapper">
                    <div class="blockSwitch left"></div>
                    <div class="blockSwitch right"></div>
                </div>
                <div>
                    <button onclick="answer('no')">НЕТ</button>
                    <button onclick="answer('yes')">ДА</button>
                </div>

            </div>

        </section>
        <section id="v2" class="route">
            <div class="game-cont">
                <div class="grid" id="grid"></div>
                <button id="rememberButton">Запомнил</button>
                <button id="checkButton" disabled>Проверить</button>
                <button id="restartButton" style="display: none;">Начать заново</button>
                <div id="message"></div>
            </div>
        </section>

    </div>
    <!-- <footer>
        <nav class="nav-bar">
            <button class="btNav" onclick="navigateTo('games')">Games</button>
            <button class="btNav" onclick="navigateTo('rating')">Rating</button>
            <button class="btNav" onclick="navigateTo('profile')">Profile</button>
        </nav>
    </footer> -->

</body>

</html>
