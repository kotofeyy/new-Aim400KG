<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js"></script>
    <script src="routing.js"></script>
    <script src="functions.js"></script>
</head>

<body>
    <div class="wrapper">
        <header>
            <button class="bt" id="back-button">Назад</button>
        </header>
        <section id="memory" class="route">
            <div class="memory_wrapper">
                <div>запомните зеленые блоки</div>
                <div class="score"></div>
                <div class="memoryDiv"></div>
                <button class="bt" id="bt" onclick="rotateBlocks()">Запомнил</button>
            </div>
        </section>
        <section id="aim" class="route">
            <div class="aim_wrapper">
                <svg version="2" baseProfile="full" width="100%" height="100vh" xmlns="http://www.w3.org/2000/svg"
                    class="demo"></svg>
                <div class="score">
                    <div class="seconds">0 ms</div>
                    <div class="average">0 ms</div>
                </div>
            </div>
        </section>
        <section id="wrongColor" class="route">
            <div class="uWrapper">
                <div>Укажи обманный блок</div>
                <div class="blockWrapper">
                </div>

            </div>
        </section>
        <section id="switching" class="route">
            <div class="uWrapper">
                <div>Ответь на вопрос</div>
                <div class="question">Является ли буква гласной?</div>
                <div class="switchWrapper">
                    <div class="blockSwitch left"></div>
                    <div class="blockSwitch right"></div>
                </div>
                <div>
                    <button onclick="answer('no')">НЕТ</button>
                    <button onclick="answer('yes')">ДА</button>
                </div>

            </div>

        </section>
        <section id="games" class="route">
            <div>
                <button class="bt " onclick="navigateTo('games/aim')">
                    aim 400kg
                </button>
                <button class="bt " onclick="navigateTo('games/memory')">
                    Запомни блоки
                </button>
                <button class="bt" onclick="navigateTo('games/wrongColor')">
                    Неправильный цвет
                </button>
                <button class="bt" onclick="navigateTo('games/switching')">
                    Простые переключения
                </button>
            </div>
        </section>
        <section id="rating" class="route">ХУЙ</section>
        <section id="profile" class="route">МОЧА</section>

    </div>
    <footer>
        <nav class="nav-bar">
            <button class="btNav" onclick="navigateTo('games')">Games</button>
            <!-- <button class="btNav" >Memory</button> -->
            <!-- <button class="btNav" onclick="navigateTo('aim')">Aim</button>
            <button class="btNav" onclick="navigateTo('wrongColor')">Wrong Color</button>
            <button class="btNav" onclick="navigateTo('switching')">Switching</button> -->
            <button class="btNav" onclick="navigateTo('rating')">Rating</button>
            <button class="btNav" onclick="navigateTo('profile')">Profile</button>
        </nav>
    </footer>

</body>

</html>
