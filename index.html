<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="styles.css" />
        <title>Моя тестовая страница</title>
    </head>

    <body>
        <canvas id="myCanvas" />
    </body>

    <script>
        let canvas = document.getElementById('myCanvas');
        let context = canvas.getContext('2d');
        let circle = new Path2D();

        //куда был совершен клик
        canvas.addEventListener('click', (e) => {
            // console.log('click: ', e.clientX, e.clientY);
            if (context.isPointInPath(circle, e.offsetX, e.offsetY)) {
                context.clip();
                drawCircle();
                console.log('click: ', e.clientX, e.clientY);
            } else {
                console.log('мимо');
                // context.fillStyle = 'red';
                // context.fill(circle);
            }
        });
        setMaxSize();
        drawCircle();
        window.addEventListener('resize', () => {
            setMaxSize();
            drawCircle();
        });

        function setMaxSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        function drawCircle(posX, posY) {
            let radius = 40;
            posX = Math.floor(Math.random() * canvas.width);
            posY = Math.floor(Math.random() * canvas.height);
            circle.arc(posX, posY, radius, 0, 2 * Math.PI, false);
            context.fillStyle = 'red';
            context.fill(circle);
        }
    </script>
</html>
